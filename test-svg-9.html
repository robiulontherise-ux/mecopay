<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; }
  .icon-wrapper { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F2F7F6;}
</style>
</head>
<body>
  <div class="icon-wrapper">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <g stroke="#37A29A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        
        <!-- Sleeve/Arm -->
        <polygon points="12,58 25,48 40,65 25,75" fill="#6CC5B8" />
        <!-- Cuff detail line -->
        <line x1="20" y1="52" x2="35" y2="69" />
        
        <!-- Bill Background -->
        <polygon points="25,40 75,22 88,58 38,76" fill="#FFFFFF" />
        <!-- Bill Inner Border -->
        <polygon points="30,42 70,27 80,54 40,69" stroke-width="3" />
        
        <!-- Bill Circle & Taka Sign -->
        <circle cx="68" cy="42" r="8" fill="#FFFFFF" />
        <text x="68" y="44" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#37A29A" font-family="sans-serif" stroke="none">৳</text>
        
        <!-- Fingers under bill -->
        <!-- Middle -->
        <path d="M 36,73 C 48,65 52,82 42,86 Z" fill="#6CC5B8" />
        <!-- Ring -->
        <path d="M 30,77 C 42,69 46,86 36,90 Z" fill="#6CC5B8" />
        <!-- Pinky -->
        <path d="M 24,81 C 36,73 40,90 30,94 Z" fill="#6CC5B8" />

        <!-- Thumb (over bill) -->
        <path d="M 25,50 C 30,40 42,42 42,48 C 42,55 35,55 35,55 Z" fill="#6CC5B8" />

      </g>
    </svg>
  </div>
</body>
</html>
