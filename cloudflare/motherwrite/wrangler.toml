name = "motherwrite"
main = "index.ts"
compatibility_date = "2025-11-01"
workers_dev = false

[vars]
BETTER_AUTH_URL = "https://mecopay.space"
ALLOWED_ORIGIN = "https://mecopay.space"

[[r2_buckets]]
binding = "KYC_BUCKET"
bucket_name = "mecopay-kyc"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "aa216e60610b4ecd8695f95a8e8a566b"

# Set with `wrangler secret put JWT_PRIVATE_KEY`.
# Optional: set `wrangler secret put JWT_PUBLIC_KEY_PEM` to verify with the
# Auth Worker's SPKI public key directly. Without it, the Worker derives only
# the public JWK from JWT_PRIVATE_KEY for signature verification.
