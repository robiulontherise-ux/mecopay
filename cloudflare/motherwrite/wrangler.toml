name = "motherwrite"
main = "index.ts"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "mecopay.space/api/mother-write*", zone_name = "mecopay.space" }]

[vars]
BETTER_AUTH_URL = "https://mecopay.space"
ALLOWED_ORIGIN = "https://mecopay.space"

[[r2_buckets]]
binding = "KYC_BUCKET"
bucket_name = "mecopay-kyc"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "aa216e60610b4ecd8695f95a8e8a566b"

# JWT_PRIVATE_KEY is an existing secret binding used only to sign the refreshed
# Mother JWT. Verification uses the canonical Auth Worker public key embedded
# in index.ts and sourced from the live Mother read Worker.
