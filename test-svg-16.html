<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; }
  .icon-wrapper { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F8F9FA;}
</style>
</head>
<body>
  <div class="icon-wrapper">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <g stroke="#009688" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- Back Bill Outline -->
        <path d="M 50,55 L 85,55 C 87,55 89,53 89,51 L 89,35 C 89,33 87,31 85,31 L 75,31" fill="none" />
        
        <!-- Front Bill -->
        <!-- Starts left, curves slightly up, goes right -->
        <path d="M 45,28 C 60,26 70,26 80,28 C 82,28 84,30 84,32 L 84,48 C 84,50 82,52 80,52 L 40,52 C 38,52 36,50 36,48 L 36,36 Z" fill="#90CEC6" />
        
        <!-- Front Bill Circle -->
        <circle cx="68" cy="40" r="8" fill="#FFFFFF" stroke="none" />
        <!-- Taka Sign -->
        <path d="M 66,37 L 66,44 M 63,39 L 71,39 M 71,37 C 73,37 74,39 72,42" stroke-width="2.5" fill="none" />
        
        <!-- Hand Base / Cuff -->
        <polygon points="12,50 25,45 32,70 18,75" fill="#90CEC6" />
        <!-- Cuff stripe -->
        <line x1="20" y1="48" x2="26" y2="72" stroke-width="3" />
        
        <!-- Palm and bottom fingers -->
        <!-- Under the bill, curving right -->
        <path d="M 28,55 C 35,65 45,65 55,62 C 60,60 65,55 60,52 C 55,52 45,55 35,55 Z" fill="#90CEC6" />
        
        <!-- Thumb -->
        <!-- Extends from top left of palm, over the top left of the bill -->
        <path d="M 25,48 C 30,35 45,30 55,35 C 58,36 58,40 55,41 C 45,41 35,45 30,55 Z" fill="#90CEC6" />

      </g>
    </svg>
  </div>
</body>
</html>
