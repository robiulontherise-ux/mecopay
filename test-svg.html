<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; }
  .icon-wrapper { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .label { text-align: center; font-size: 13px; margin-top: 10px; color: #1e293b; }
</style>
</head>
<body>

<div>
  <div class="icon-wrapper" style="background: #F8EBEB;">
    <svg viewBox="0 0 100 100" width="48" height="48">
      <circle cx="65" cy="50" r="22" stroke="#DE6471" stroke-width="6" fill="none" />
      <text x="65" y="52" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="bold" fill="#DE6471" font-family="sans-serif">৳</text>
      <!-- Speed lines -->
      <line x1="15" y1="35" x2="35" y2="35" stroke="#DE6471" stroke-width="5" stroke-linecap="round" />
      <line x1="10" y1="50" x2="30" y2="50" stroke="#DE6471" stroke-width="5" stroke-linecap="round" />
      <line x1="20" y1="65" x2="40" y2="65" stroke="#DE6471" stroke-width="5" stroke-linecap="round" />
    </svg>
  </div>
  <div class="label">Send Money</div>
</div>

<div>
  <div class="icon-wrapper" style="background: #E9F2ED;">
    <svg viewBox="0 0 100 100" width="48" height="48">
      <rect x="30" y="15" width="40" height="70" rx="6" stroke="#6FB08B" stroke-width="5" fill="none" />
      <line x1="45" y1="22" x2="55" y2="22" stroke="#6FB08B" stroke-width="3" stroke-linecap="round" />
      <line x1="45" y1="80" x2="55" y2="80" stroke="#6FB08B" stroke-width="3" stroke-linecap="round" />
      <circle cx="50" cy="50" r="14" stroke="#6FB08B" stroke-width="4" fill="none" />
      <text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#6FB08B" font-family="sans-serif">৳</text>
    </svg>
  </div>
  <div class="label">Mobile Recharge</div>
</div>

<div>
  <div class="icon-wrapper" style="background: #EAF5F4;">
    <svg viewBox="0 0 100 100" width="48" height="48">
      <!-- Bill -->
      <path d="M40 30 L90 30 L85 70 L35 70 Z" stroke="#40B0A6" stroke-width="5" fill="none" stroke-linejoin="round" />
      <circle cx="65" cy="50" r="12" stroke="#40B0A6" stroke-width="4" fill="none" />
      <text x="65" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#40B0A6" font-family="sans-serif">৳</text>
      <!-- Hand holding the bill -->
      <path d="M10 70 L30 70 C35 70 40 65 40 60 L40 50 C40 45 35 40 30 40 L20 40" stroke="#40B0A6" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M10 50 L20 50" stroke="#40B0A6" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M10 60 L20 60" stroke="#40B0A6" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <div class="label">Cash Out</div>
</div>

</body>
</html>
