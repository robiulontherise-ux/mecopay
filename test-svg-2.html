<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; }
  .icon-wrapper { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f5f5f5;}
  .label { text-align: center; font-size: 12px; margin-top: 10px; color: #1e293b; }
</style>
</head>
<body>

<div>
  <div class="icon-wrapper" style="background: #F8EBEB;">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <circle cx="65" cy="50" r="22" stroke="#DE6C7D" stroke-width="6" fill="none" />
      <text x="65" y="52" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="bold" fill="#DE6C7D" font-family="sans-serif">৳</text>
      <line x1="15" y1="35" x2="35" y2="35" stroke="#DE6C7D" stroke-width="5" stroke-linecap="round" />
      <line x1="10" y1="50" x2="30" y2="50" stroke="#DE6C7D" stroke-width="5" stroke-linecap="round" />
      <line x1="20" y1="65" x2="40" y2="65" stroke="#DE6C7D" stroke-width="5" stroke-linecap="round" />
    </svg>
  </div>
  <div class="label">Send Money</div>
</div>

<div>
  <div class="icon-wrapper" style="background: #E8F4EC;">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <rect x="25" y="10" width="50" height="80" rx="8" fill="#6EAC8C" />
      <line x1="45" y1="18" x2="55" y2="18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="45" y1="90" x2="55" y2="90" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <circle cx="50" cy="50" r="15" fill="#FFFFFF" />
      <text x="50" y="53" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#6EAC8C" font-family="sans-serif">৳</text>
    </svg>
  </div>
  <div class="label">Mobile Recharge</div>
</div>

<div>
  <div class="icon-wrapper" style="background: #EAF4F3;">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <!-- Bill base -->
      <path d="M45 25 L95 25 L90 65 L40 65 Z" fill="#4CAEA3" />
      <circle cx="70" cy="45" r="12" fill="#FFFFFF" />
      <text x="70" y="47" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#4CAEA3" font-family="sans-serif">৳</text>
      <!-- Fold of bill? Actually the bill has a corner fold or lines -->
      <path d="M40 65 L35 75 L85 75 L90 65 Z" fill="#3D938A" />
      
      <!-- Hand holding the bill -->
      <path d="M5 70 L30 70 C35 70 40 65 40 60 L40 45 C40 40 35 35 30 35 L20 45" stroke="#4CAEA3" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M5 50 L20 50" stroke="#4CAEA3" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M5 60 L20 60" stroke="#4CAEA3" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <div class="label">Cash Out</div>
</div>

</body>
</html>
