<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; }
  .icon-wrapper { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f5f5f5;}
  .label { text-align: center; font-size: 12px; margin-top: 10px; color: #1e293b; }
</style>
</head>
<body>

<div>
  <div class="icon-wrapper" style="background: #EAF4F3;">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <!-- Bill -->
      <path d="M 35 30 L 85 20 L 95 60 L 45 70 Z" fill="#4CAEA3" />
      <!-- Bill inner line -->
      <path d="M 40 35 L 80 27" stroke="#3A9A90" stroke-width="2" />
      <path d="M 88 55 L 48 63" stroke="#3A9A90" stroke-width="2" />
      <circle cx="65" cy="45" r="14" fill="#FFFFFF" />
      <text x="65" y="47" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="bold" fill="#4CAEA3" font-family="sans-serif">৳</text>
      
      <!-- Hand Cuff -->
      <path d="M 5 60 L 25 55 L 35 90 L 15 95 Z" fill="#4CAEA3" />
      <path d="M 23 55 L 33 52 L 40 85 L 30 88 Z" fill="#3A9A90" />
      
      <!-- Fingers -->
      <!-- Thumb -->
      <path d="M 30 52 C 40 45 45 45 45 50 C 45 55 35 60 30 65" fill="#4CAEA3" stroke="#FFFFFF" stroke-width="2" />
      
      <!-- Other fingers overlapping bill -->
      <path d="M 32 66 C 45 60 55 65 55 70 C 55 75 40 80 32 82" fill="#4CAEA3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <path d="M 33 75 C 45 70 52 75 52 80 C 52 85 40 88 34 88" fill="#4CAEA3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <path d="M 35 83 C 45 80 48 83 48 87 C 48 91 40 93 35 93" fill="#4CAEA3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="label">Cash Out</div>
</div>

</body>
</html>
