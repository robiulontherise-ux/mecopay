<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; }
  .icon-wrapper { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f5f5f5;}
  .label { text-align: center; font-size: 12px; margin-top: 10px; color: #1e293b; }
</style>
</head>
<body>

<div>
  <div class="icon-wrapper" style="background: #EAF4F3;">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <g stroke="#39A499" stroke-width="5" fill="#39A499" stroke-linecap="round" stroke-linejoin="round">
        <!-- Sleeve -->
        <polygon points="15,45 35,40 40,75 20,80" />
        <!-- Cuff -->
        <polygon points="30,38 42,35 47,78 35,80" fill="#2E867D" stroke="#2E867D" />
        
        <!-- Bill -->
        <polygon points="45,25 85,20 95,55 55,60" fill="none" />
        <circle cx="70" cy="40" r="8" fill="#39A499" stroke="none" />
        
        <!-- Hand / Fingers -->
        <!-- Thumb -->
        <path d="M 40,45 C 50,42 55,45 50,55" fill="none"/>
        <!-- Fingers -->
        <path d="M 43,60 C 55,55 65,65 55,70" fill="none"/>
        <path d="M 40,68 C 50,65 60,75 50,80" fill="none"/>
        <path d="M 35,75 C 45,72 55,80 45,85" fill="none"/>
      </g>
    </svg>
  </div>
  <div class="label">Cash Out</div>
</div>

</body>
</html>
