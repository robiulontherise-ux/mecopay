<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; }
  .icon-wrapper { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F8F9FA;}
</style>
</head>
<body>
  <div class="icon-wrapper" style="background: #FAFAFA;">
    <svg viewBox="0 0 100 100" width="40" height="40">
      <g stroke="#008C82" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- Back Bill -->
        <path d="M 50,55 L 85,55 C 87,55 89,53 89,51 L 89,35 C 89,33 87,31 85,31 L 65,31" fill="none" />
        
        <!-- Front Bill Base -->
        <path d="M 40,28 C 55,25 65,25 80,28 C 82,28 84,30 84,32 L 84,48 C 84,50 82,52 80,52 L 40,52 C 38,52 36,50 36,48 L 36,32 C 36,30 38,28 40,28 Z" fill="#9CD8D0" />
        
        <!-- Front Bill Details -->
        <!-- Curved line on the left side of the bill -->
        <path d="M 42,32 C 45,38 45,42 42,48" fill="none" stroke-width="3" />
        
        <circle cx="68" cy="40" r="7" fill="#FFFFFF" stroke="none" />
        <!-- Taka Sign -->
        <path d="M 66,37 L 66,43 M 64,38 L 70,38 M 70,36 C 72,36 73,38 71,41" stroke-width="2" fill="none" />
        
        <!-- Cuff -->
        <polygon points="12,48 24,42 32,62 20,68" fill="#9CD8D0" />
        <!-- Cuff stripe -->
        <line x1="20" y1="46" x2="26" y2="62" stroke-width="3" />
        
        <!-- Palm and bottom fingers -->
        <path d="M 28,52 L 35,50 C 45,65 55,60 62,56 C 65,54 62,50 58,52 C 55,54 48,56 40,52 Z" fill="#9CD8D0" />
        <!-- Actually, the fingers in the image wrap straight under -->
        
        <!-- Thumb -->
        <path d="M 24,48 C 30,35 45,32 55,38 C 58,40 55,42 50,42 C 45,42 35,42 30,52 Z" fill="#9CD8D0" />

      </g>
    </svg>
  </div>
</body>
</html>
