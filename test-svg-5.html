<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; }
  .icon-wrapper { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f5f5f5;}
</style>
</head>
<body>

  <div class="icon-wrapper" style="background: #E8F4EC;">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <rect x="28" y="15" width="44" height="70" rx="8" fill="#71B291" />
      <line x1="43" y1="24" x2="57" y2="24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <circle cx="50" cy="78" r="2.5" fill="#FFFFFF" />
      <circle cx="50" cy="50" r="16" fill="#FFFFFF" />
      <text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#71B291" font-family="sans-serif">৳</text>
    </svg>
  </div>

  <div class="icon-wrapper" style="background: #EAF4F3;">
    <svg viewBox="0 0 100 100" width="36" height="36">
      <!-- Bill -->
      <polygon points="45,28 90,28 85,65 40,65" fill="#43B0A4" stroke="#43B0A4" stroke-width="4" stroke-linejoin="round" />
      <circle cx="68" cy="46" r="12" fill="#FFFFFF" />
      <text x="68" y="48" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#43B0A4" font-family="sans-serif">৳</text>
      
      <!-- Hand Cuff -->
      <polygon points="10,40 25,40 25,80 10,80" fill="#43B0A4" stroke="#43B0A4" stroke-width="4" stroke-linejoin="round" />
      <line x1="28" y1="38" x2="28" y2="82" stroke="#2B8379" stroke-width="4" stroke-linecap="round" />
      
      <!-- Fingers over bill -->
      <!-- Thumb -->
      <path d="M28 45 C45 45 45 55 28 55" fill="#43B0A4" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- Finger 1 -->
      <path d="M28 55 C48 55 48 65 28 65" fill="#43B0A4" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- Finger 2 -->
      <path d="M28 65 C45 65 45 75 28 75" fill="#43B0A4" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- Finger 3 -->
      <path d="M28 75 C40 75 40 85 28 85" fill="#43B0A4" stroke="#FFFFFF" stroke-width="2.5" />
    </svg>
  </div>

</body>
</html>
