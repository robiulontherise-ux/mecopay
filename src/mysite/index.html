<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store</title>
    <script>
      (function() {
        try {
          var cachedName = localStorage.getItem('cached_site_name');
          var cachedLogo = localStorage.getItem('cached_site_logo');
          if (cachedName) document.title = cachedName;
          if (cachedLogo) {
            var links = document.querySelectorAll("link[rel*='icon'], link[rel='apple-touch-icon']");
            links.forEach(function(l) { l.href = cachedLogo; });
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Your dynamic online store" />
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/cJk7YcMb/favicon.jpg" />
    <link rel="shortcut icon" type="image/jpeg" href="https://i.postimg.cc/cJk7YcMb/favicon.jpg" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/cJk7YcMb/favicon.jpg" />
    <meta property="og:title" content="MecoPay Store" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/mysite/main.tsx"></script>
  </body>
</html>
