<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link id="app-favicon" rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" />
    <link id="app-apple-favicon" rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('mysite_cached_title');
          var l = localStorage.getItem('mysite_cached_logo');
          if (t && t.trim()) {
            document.title = t.trim();
          }
          if (l && l.trim()) {
            var f = document.getElementById('app-favicon');
            if (f) f.href = l.trim();
            var a = document.getElementById('app-apple-favicon');
            if (a) a.href = l.trim();
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
